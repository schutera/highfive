# CI test workflow.
#
# Fifteen parallel jobs. Keep this list in step with the `jobs:` map
# below — it drifted once already, claiming ten while defining twelve.
#
#   esp-native      → host-side Unity tests for the pure C++ helpers
#                     under ESP32-CAM/lib/. Fast (~1 min cold).
#
#   esp-firmware    → 'pio run -e esp32cam': cross-compiles the actual
#                     firmware against the espressif32 platform. Catches
#                     breakage that only shows up when the .ino + .cpp
#                     sources are linked together for the target.
#
#   backend-unit    → vitest + supertest unit tests for the Node/Express
#                     backend API (mocks db layer).
#
#   duckdb-unit     → pytest unit tests for the DuckDB service (real
#                     in-memory DuckDB, no outbound HTTP).
#
#   image-unit      → pytest unit tests for the image-service (all
#                     outbound HTTP and duckdb.connect are mocked).
#
#   homepage-unit   → vitest + jsdom smoke tests for the React homepage.
#
#   ts-quality      → `tsc --noEmit` across all three npm workspaces plus
#                     ESLint. Neither unit job type-checks: vitest and tsx
#                     both strip types via esbuild without checking them
#                     (#208).
#
#   doc-citations   → walks `path:line` references in docs/ and CLAUDE.md
#                     and verifies each one resolves to a non-blank line
#                     of the current source. Fast (<10 s).
#
#   shellcheck      → `shellcheck -x -S info` over scripts/*.sh,
#                     scripts/lib/*.sh and
#                     ESP32-CAM/build.sh — the highest-blast-radius files
#                     in the repo (#196).
#
#   duckdb-bind-claims
#                   → asserts dev keeps duckdb-service LAN-reachable while
#                     prod stays loopback-only, and that the docs say so.
#
#   python-version-consistency
#                   → asserts the Dockerfiles, ruff floor, and pytest
#                     matrices all match /.python-version (the single
#                     source of truth). Guards the #180 root cause. Fast.
#
#   python-lint     → ruff check + ruff format --check over both Python
#                     services under one root ruff.toml. Until #209 ruff
#                     ran only in a pre-commit hook, and the py310 floor
#                     that guards #180 covered image-service alone.
#
#   repo-guards     → the guard scripts that had no CI backstop before
#                     #210 (hardcoded secrets, stale reset prose, stale
#                     displayName rule) plus the python twin-file drift
#                     gate (#241). Hooks are bypassable; the production
#                     host bypasses them by design (HUSKY=0).
#
#   e2e-pipeline    → boots the four-service docker compose, drives it
#                     with the Python mock ESP, asserts the upload chain
#                     works end-to-end. Slower (~5 min cold).
#
#   ui-playwright   → boots the four-service stack plus a production-built
#                     homepage container, seeds UI-specific fixtures, drives
#                     real Chromium through the SPA. Pins the chapter-11
#                     regressions (envelope drift, side-list filter) that
#                     jsdom + mocks could not catch. Slowest (~6 min cold).
#
# Note on Python versions in this file: only the `duckdb-unit` /
# `image-unit` matrices (3.10–3.14) exercise the *service runtime*. The
# `Set up Python 3.11` steps in esp-native / esp-firmware / e2e-pipeline /
# ui-playwright configure the *host runner's* tooling (PlatformIO, the
# pytest driver, Playwright seed scripts) — not the services, which run
# 3.10-slim per /.python-version (#197). Don't read those 3.11s as the
# runtime floor.
#
# Triggers on PRs to main and on push to main (badge stays green there)
# and on push to the chore/test-harness branch so the workflow validates
# itself before being merged.

name: tests

# Adding a new trigger here? Then also:
#   1. Update the matrix in docs/08-crosscutting-concepts/auth.md
#      ("GitHub Actions integration" — 5 rows today, one per current trigger).
#   2. Revisit the esp-firmware "Guard — GEO_API_KEY must be set on main"
#      step's `if:` so manual / scheduled runs against `main` stay
#      protected from accidentally building Null-Island firmware.
# Without those two updates, the doc and the guard drift silently from
# the actual trigger matrix. See chapter 11 lessons-learned
# "Drift sweep is not a substitute for a CI check" for why we do not
# rely on prose warnings alone for this kind of cross-surface
# consistency.
on:
  push:
    # `production` is here for the repo-guards job (#210). scripts/deploy.sh
    # installs with HUSKY=0 and then pushes the firmware auto-bump commit to
    # `production` from the live host, so the one push that actually reaches
    # the fleet runs no pre-push hook at all. Without this trigger that
    # commit is the least-checked commit in the repo.
    branches: [main, production, 'chore/test-harness']
  pull_request:
    branches: [main]

# Cancel previous runs of this workflow on the same ref when a new push
# arrives — avoids burning Actions minutes on superseded commits.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp-native:
    name: ESP32-CAM native unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('ESP32-CAM/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Run native unit tests
        working-directory: ESP32-CAM
        run: pio test -e native

  esp-firmware:
    name: ESP32-CAM firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-fw-${{ runner.os }}-${{ hashFiles('ESP32-CAM/platformio.ini') }}
          restore-keys: |
            pio-fw-${{ runner.os }}-

      # Hard-fail when building from main with no GEO_API_KEY stored. On
      # main, a missing secret means deployed firmware would skip the
      # Google call at first boot and report (0, 0, 0) — modules plot at
      # Null Island on the dashboard. We want a loud build failure, not
      # a silent broken release. Fork PRs and same-repo branch builds
      # are exempt: forks can't access secrets by design (GitHub
      # security feature), and branch builds may legitimately be tested
      # without the production key. See
      # docs/08-crosscutting-concepts/auth.md "Third-party API keys".
      - name: Guard — GEO_API_KEY must be set on main and production
        # `production` is included since #210 added it to the push
        # triggers: it is the branch firmware actually ships from, so a
        # missing secret there would publish Null-Island firmware to the
        # fleet — strictly worse than the same mistake on `main`.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
        env:
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: |
          if [ -z "${GEO_API_KEY}" ]; then
            echo "::error title=GEO_API_KEY missing::No GEO_API_KEY repository secret is configured. A main-branch firmware build without the key produces Null Island modules. Add the secret at https://github.com/${{ github.repository }}/settings/secrets/actions before re-running this workflow."
            exit 1
          fi
          echo "GEO_API_KEY present (len=${#GEO_API_KEY})"

      - name: Build esp32cam firmware
        working-directory: ESP32-CAM
        env:
          # extra_scripts.py reads this via os.environ.get and injects
          # -DGEO_API_KEY="<value>" into the firmware build. The value
          # never reaches build logs — only its length is printed.
          # Empty / missing on fork PRs is intentional; the runtime
          # guard handles it. The push-to-main guard above catches
          # accidental "deleted secret on main" regressions.
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: pio run -e esp32cam

  backend-unit:
    name: Backend unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Single root lockfile since the npm workspaces refactor —
          # `backend/`, `homepage/`, and `contracts/` all install via the
          # root `package-lock.json`.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspace backend

  duckdb-unit:
    name: DuckDB service unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Matrix the full supported Python range. CI historically ran only 3.11,
    # while the repo named its runtime three disagreeing ways — the container
    # path built `python:3.12-slim`, the deploy docs said 3.11, and the
    # bare-metal PM2 host that crashed (#180) ran 3.10. That drift was
    # reconciled to a single 3.10 floor in #197 (both Dockerfiles now pin
    # `python:3.10-slim`, /.python-version is the source of truth, and
    # `make check-python-version` guards it). The matrix stays because a
    # single-version lane can't see a version-specific API: the 3.11-only
    # `datetime.UTC` slipped through precisely because CI tested one version
    # (#180; rationale + floated pins in ADR-029). 3.10 is the conservative
    # floor, 3.14 the forward ceiling. fail-fast: false so one version's
    # failure doesn't mask the others.
    #
    # Keep this an explicit list, NOT `python-version-file: .python-version`:
    # that file is the *floor*, and reading it here would cap every cell to
    # 3.10 and silently defeat the forward-compat matrix (#197).
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: duckdb-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: duckdb-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: duckdb-service
        run: pytest tests/ -q

  image-unit:
    name: Image service unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same 3.10–3.14 matrix as duckdb-unit (the log_ring.py that broke is
    # duplicated in both services). image-service's native deps (numpy,
    # onnxruntime) are floated to `>=` in requirements.txt precisely so this
    # matrix can resolve a per-interpreter wheel — no single pinned version
    # spans cp310…cp314. See ADR-029. As with duckdb-unit, keep this an
    # explicit list — `python-version-file: .python-version` would cap every
    # cell to the 3.10 floor and defeat the matrix (#197).
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: image-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: image-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: image-service
        run: pytest tests/ -q

  homepage-unit:
    name: Homepage unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Single root lockfile since the npm workspaces refactor.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspace homepage

  ts-quality:
    name: TypeScript typecheck + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Single root lockfile since the npm workspaces refactor.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        # Neither existing TS job type-checks anything: vitest compiles
        # via esbuild and `tsx` runs the dev server the same way, both of
        # which strip types without checking them. Before #208 the first
        # `tsc` in the pipeline ran on the production host inside
        # `scripts/deploy.sh`, with its output sent to /dev/null — so a
        # type-broken change merged green, got promoted to `production`,
        # and then rolled back on every timer tick with a reason-less
        # message. This job is what stops that reaching the host.
        run: npm run typecheck

      - name: Lint all workspaces
        # Flat config at the repo root; `eslint-config-prettier` is last
        # so nothing here fights prettier, which owns formatting via
        # lint-staged. Until #208 the repo had no ESLint at all and the
        # `eslint-disable` comments scattered through homepage/src were
        # decorative — suppressing rules that no linter was running.
        run: npm run lint

  doc-citations:
    name: Doc-citation drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check-doc-citations.sh
        # Walks every `path:line` citation in docs/ + CLAUDE.md, reads
        # the cited line in the current source, and fails on missing
        # files / past-EOF citations / basename-ambiguous citations.
        # See docs/11-risks-and-technical-debt/ "Drift sweep is not a
        # substitute for a CI check".
        run: bash scripts/check-doc-citations.sh

  shellcheck:
    name: Shell script lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck over the deploy + release scripts
        # These are the highest-blast-radius files in the repo and the only
        # ones no other job touches. `scripts/deploy.sh` runs as root on the
        # live host every 2 minutes, unattended, and can reload services, reset
        # the working tree, and publish an irreversible firmware OTA to the
        # fleet; `ESP32-CAM/build.sh` produces the artifacts and manifest that
        # OTA ships. Until #196 nothing checked either — `bash -n` in a PR
        # description was the entire verification story.
        #
        # `-S info` (not just `warning`) is deliberate: SC2086, unquoted
        # expansion, is info-level, and it is the bug class most likely to bite
        # a root-run script handling paths. All files are clean at this level
        # today, so the gate costs nothing to keep. shellcheck ships
        # preinstalled on ubuntu-latest runners.
        #
        # `-x` follows `source`d files so the shared interpreter probe in
        # scripts/lib/ is analysed in the context of each caller (#273);
        # without it every `.` line reports SC1091 at info level and this job
        # goes red. scripts/lib/*.sh is listed explicitly because scripts/*.sh
        # does not match a subdirectory, and an unlinted helper sourced by
        # three linted scripts is the gap this job exists to close.
        run: shellcheck -x -S info scripts/*.sh scripts/lib/*.sh ESP32-CAM/build.sh

  duckdb-bind-claims:
    name: DuckDB bind/docs consistency gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check-duckdb-bind-claims.sh
        # dev and prod bind duckdb-service's host port DIFFERENTLY on purpose:
        # prod is loopback-only because host-Nginx proxies /new_module and
        # /heartbeat, and dev must stay LAN-reachable because the LAN-dev
        # firmware posts straight at http://<DEV_SERVER_HOST>:8002 with no
        # proxy in front. The 2026-07 audit (#203) "hardened" dev to match
        # prod and silently broke ESP registration + heartbeat on every
        # bench, shipping docs that asserted the ESP never talks to
        # duckdb-service directly. The revert then left a contradicting
        # sentence in auth.md for a second review round to find. See
        # docs/11-risks-and-technical-debt/ "Hardening dev to match prod".
        run: bash scripts/check-duckdb-bind-claims.sh

  python-version-consistency:
    name: Python-version consistency gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check-python-version.sh
        # Asserts the Dockerfiles, image-service ruff floor, and the
        # duckdb-unit/image-unit pytest matrices all match the single
        # source of truth in /.python-version. The runtime drifting
        # across three surfaces was the root cause of #180 (a 3.11-only
        # datetime.UTC that crashed both Python services on deploy).
        # See ADR-029 and docs/11-risks-and-technical-debt/ "CI tested
        # only Python 3.11".
        run: bash scripts/check-python-version.sh

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Lint does not need the runtime matrix — the floor that
          # matters is `target-version` in the root ruff.toml, which
          # `check-python-version.sh` pins to /.python-version. This is
          # only the host interpreter that runs ruff itself.
          python-version: '3.12'

      - name: Install ruff
        # Same pin both services carry in requirements-dev.txt. Pinned
        # rather than floating because a ruff minor bump can add rules,
        # which would turn an unrelated PR red.
        run: pip install ruff==0.14.1

      - name: Run ruff check
        # Before #209 ruff ran only in the lint-staged pre-commit hook,
        # so anyone bypassing hooks shipped unlinted code — and on
        # Windows the bare `ruff` invocation frequently isn't on PATH at
        # all, so the hook silently never ran. More importantly the
        # py310 `target-version` pin, which stops UP-family autofixes
        # rewriting `datetime.now(timezone.utc)` into the 3.11-only
        # `datetime.UTC` that crashed both services in #180, lived only
        # in image-service's config — duckdb-service ran under ruff
        # defaults. One root ruff.toml now governs both.
        #
        # Scoped to the two services rather than `.` on purpose: the repo
        # also carries Python under ESP32-CAM/, scripts/, tools/ and
        # tests/e2e/ that has never been linted and currently trips 38
        # findings. Widening the scope is worthwhile but is its own change
        # — see #257 (repo hygiene). Keep this list in step with the
        # matching glob in .lintstagedrc.json.
        run: ruff check duckdb-service image-service

      - name: Run ruff format --check
        run: ruff format --check duckdb-service image-service

  repo-guards:
    name: Repo guard scripts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The four scripts below ran ONLY from .husky/pre-push until #210.
      # A contributor pushing with --no-verify, a fork PR, a web IDE, or
      # a CI bot bypassed all of them with no net — and CLAUDE.md
      # forbidding --no-verify is not a control, it is a request. The
      # production host bypasses them structurally: scripts/deploy.sh
      # installs with HUSKY=0 and then pushes the firmware auto-bump to
      # `production` itself, so the one push that ships to the field was
      # the least checked push in the repo.
      - name: Run check-no-hardcoded-api-keys.sh
        # A security control, and the reason this job is not optional:
        # greps for Google API key literals, Discord webhook URLs, and
        # `WiFi.begin()` calls carrying a literal SSID/passphrase
        # (issues #18, #201, #227).
        run: bash scripts/check-no-hardcoded-api-keys.sh

      - name: Run check-stale-display-name-rule.sh
        # Catches the deprecated `displayName ?? name` label rule
        # re-emerging. `??` only short-circuits on null, so it renders an
        # empty string where `displayLabel.ts` renders the fallback. See
        # docs/11-risks-and-technical-debt/ "`displayName ?? name` lived
        # in seven docs and eight render sites".
        run: bash scripts/check-stale-display-name-rule.sh

      - name: Run check-stale-reset-prose.sh
        # Catches the pre-#40 "hold IO0 for 5 seconds" factory-reset
        # prose regressing into user-facing surfaces. GPIO0 is a strap
        # pin; the instruction bricks the boot into flash mode.
        run: bash scripts/check-stale-reset-prose.sh

      - name: Run check-python-twins.sh
        # Five Python modules are hand-duplicated between image-service
        # and duckdb-service because Python has no workspace mechanism.
        # The docstrings claimed they were "kept in sync" but nothing
        # enforced it, and discord.py had already drifted (#241). Each
        # service's pytest only imports its own copy, so a redaction fix
        # applied to one log_ring.py passes both suites green while the
        # other service keeps leaking.
        run: bash scripts/check-python-twins.sh

  e2e-pipeline:
    name: End-to-end pipeline test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/e2e/requirements.txt

      - name: Show Docker version
        run: docker version && docker compose version

      - name: Run e2e pipeline tests
        run: python -m pytest tests/e2e/ -v --tb=short

      - name: Capture compose logs on failure
        if: failure()
        run: |
          docker compose -f tests/e2e/docker-compose.test.yml \
                         -p highfive-e2e logs --no-color || true

  ui-playwright:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # tests/ui/ is intentionally NOT a root workspace (so the
          # Playwright browser cache stays out of homepage/backend
          # resolution), so it has its own lockfile.
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install UI test deps
        working-directory: tests/ui
        run: npm ci

      - name: Install seed-script deps
        run: pip install -r tests/e2e/requirements.txt

      # The browser binaries Playwright fetches live in
      # ~/.cache/ms-playwright (~150 MB Chromium). Cache key tracks the
      # tests/ui lockfile so a Playwright minor bump invalidates the
      # cache and the runner pays the install cost on the next push.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('tests/ui/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests/ui
        run: npx playwright install-deps chromium

      - name: Show Docker version
        run: docker version && docker compose version

      - name: Boot UI stack
        run: |
          docker compose -f tests/ui/docker-compose.ui.yml \
                         -p highfive-ui up -d --build
          echo "--- containers ---"
          docker compose -f tests/ui/docker-compose.ui.yml -p highfive-ui ps

      - name: Seed UI-specific fixtures
        run: python tests/ui/scripts/seed_ui_fixtures.py

      - name: Run Playwright specs
        working-directory: tests/ui
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/ui/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Capture compose logs on failure
        if: failure()
        run: |
          for svc in homepage backend image-service duckdb-service; do
            echo "==================== $svc ===================="
            docker compose -f tests/ui/docker-compose.ui.yml \
                           -p highfive-ui logs --no-color "$svc" 2>&1 || true
          done

      # Cat the JSON report inline so the failure cause is in the log
      # even when artifact download is unavailable. test-results/
      # also holds per-failure trace + screenshot + video as siblings.
      - name: Dump Playwright failure summary on failure
        if: failure()
        run: |
          echo "--- tests/ui/test-results/ tree ---"
          find tests/ui/test-results -maxdepth 3 -type f 2>/dev/null | head -50 || true
          echo "--- error-context.md per failure ---"
          find tests/ui/test-results -name 'error-context.md' -exec sh -c 'echo "===== {} ====="; cat "{}"' \; 2>/dev/null || true

      - name: Tear down UI stack
        if: always()
        run: |
          docker compose -f tests/ui/docker-compose.ui.yml \
                         -p highfive-ui down -v || true
