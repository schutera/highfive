# Rate + body-size limits for the two internet-reachable, credential-free
# duckdb-service write routes (2026-08 audit, for #229). `/upload` already
# carries `client_max_body_size 10M` in the main site config
# (docs/07-deployment-view/production-deployment.md) — this file only
# adds the two routes that had NO nginx-level bound at all.
#
# `limit_req_zone` must live in the `http {}` context, not inside a
# `server {}` block. On the standard Debian/Ubuntu nginx layout
# (`/etc/nginx/nginx.conf` -> `include /etc/nginx/conf.d/*.conf;` inside
# `http {}`), the simplest wiring is:
#
#   sudo cp deploy/nginx/highfive-ingest.conf /etc/nginx/conf.d/highfive-ingest.conf
#
# then reference the two zones from the existing `location = /new_module`
# and `location = /heartbeat` blocks in
# /etc/nginx/sites-available/highfive (see production-deployment.md) by
# adding one `limit_req` line and one `client_max_body_size` line to each,
# as shown in the commented-out example blocks below. `sudo nginx -t`
# before `systemctl reload nginx`, always.
#
# Sizing rationale (see issue #224 — the per-claimed-MAC upload rate guard
# has the same "many modules, one NAT" shape): a single site can host many
# modules behind one router, so the bound must survive a burst of *all of
# them* calling in around the same wall-clock minute (a shared daily-reboot
# window, ADR-007) — not just one module's own cadence. Both zones are
# therefore sized as a per-minute burst, not a per-second one, and `nodelay`
# so a legitimate burst isn't queued/delayed, only capped.

# /new_module: fired once per boot (daily reboot, ADR-007) per module, plus
# an operator's initial onboarding. 30 req/min steady-state with a burst of
# 20 comfortably covers a large single-site fleet all rebooting at once,
# while still bounding a scripted hammering loop. With `nodelay`, the
# number that actually matters is burst+1 = 21: that's the real
# instantaneous ceiling per NAT'd site (request 22 in the same window gets
# nginx's default 503, which counts toward the firmware's failure-streak
# breaker). Resize `burst=` up if a real site's fleet exceeds ~20 modules
# rebooting in the same minute.
limit_req_zone $binary_remote_addr zone=hf_new_module:10m rate=30r/m;

# /heartbeat: fired hourly per module in steady state, but a fleet can also
# retry sooner on failure (#172). 120 req/min (2/s average) with a burst of
# 60 is generous for many modules at one site without being unbounded — the
# real instantaneous ceiling is burst+1 = 61 (same `nodelay` reasoning as
# above).
limit_req_zone $binary_remote_addr zone=hf_heartbeat:10m rate=120r/m;

